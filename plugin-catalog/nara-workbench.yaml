description: The Nara desktop app in your browser. `nara workbench` serves the desktop interface through the Nara dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `nara workbench` run and again after each Nara update it runs `npm install --ignore-scripts` (guided by Nara's lockfile) and Vite against your Nara checkout's desktop sources, writing only under ~/.nara/nara-workbench and its own plugin dir (the checkout is only read), and starts `nara dashboard` on loopback when none is running.
