name: Skills Index Freshness Check

# Independent monitor for the twice-daily build_skills_index pipeline.
# If the live /docs/api/skills-index.json ever goes more than 26 hours
# stale OR the file disappears entirely OR a major source has collapsed,
# this workflow opens a GitHub issue so we hear about it before users do.
#
# Triggered every 4 hours after GitHub Pages has been enabled.
#
# The check-catalog-cors job watches the same host from Nara Desktop's side:
# it fetches /docs/api/plugins.json with a browser's Origin header and files
# its own issue when a browser would block the fetch.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pages-enabled:
    if: github.repository == 'engsathiago/nara-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether Nara Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  check-freshness:
    needs: pages-enabled
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Probe live index
        id: probe
        run: |
          set -e
          URL="https://engsathiago.github.io/nara-agent/docs/api/skills-index.json"
          echo "Probing $URL"
          # -L follows redirects; -f fails on HTTP errors; -s suppresses progress
          if ! curl -fsSL --retry 3 --retry-delay 10 -o /tmp/skills-index.json "$URL"; then
            echo "status=fetch-failed" >> "$GITHUB_OUTPUT"
            echo "detail=Could not download $URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validate + extract generated_at and per-source counts
          python3 scripts/ci/skills_index_probe.py /tmp/skills-index.json >> "$GITHUB_OUTPUT"

      - name: Report status
        run: |
          echo "Probe status: ${{ steps.probe.outputs.status }}"
          echo "Detail:       ${{ steps.probe.outputs.detail }}"
          if [ -n "${{ steps.probe.outputs.summary }}" ]; then
            echo "Summary:      ${{ steps.probe.outputs.summary }}"
          fi

      - name: Open issue on degraded / failed probe
        if: steps.probe.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: python3 scripts/ci/skills_index_watchdog_issue.py skills-index

  check-catalog-cors:
    # Desktop's nara://plugin/install?catalog= links fetch /docs/api/plugins.json
    # cross-origin. A browser rejects that fetch when any response in the redirect
    # chain lacks Access-Control-Allow-Origin (#136483). The probe above uses
    # curl -L, which never checks CORS, so it stays green while Desktop is blocked.
    needs: pages-enabled
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the plugin catalog the way Desktop does
        id: probe
        run: |
          set +e
          detail=$(python3 scripts/ci/check_catalog_cors.py)
          code=$?
          echo "$detail"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "status=ok" >> "$GITHUB_OUTPUT" ;;
            1) echo "status=blocked" >> "$GITHUB_OUTPUT" ;;
            *) echo "status=unreachable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open issue when Desktop cannot read the catalog
        if: steps.probe.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.probe.outputs.status }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: python3 scripts/ci/skills_index_watchdog_issue.py plugin-catalog-cors
