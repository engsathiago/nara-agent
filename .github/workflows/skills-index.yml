name: Build Skills Index

on:
  schedule:
    # Run twice daily: 6 AM and 6 PM UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch: # Manual trigger
  push:
    branches: [main]
    paths:
      - "scripts/build_skills_index.py"
      - ".github/workflows/skills-index.yml"

permissions:
  contents: read

concurrency:
  group: nara-skills-index
  cancel-in-progress: false

jobs:
  build-index:
    if: github.repository == 'engsathiago/nara-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Critical path (Sep 2026): clawhub walk ∥ github taps ~8 min, then skills.sh
    # resolve ~6 min, then a bounded 8 min owner enrichment. 15 min cancelled every
    # scheduled run for two months and left the live index frozen; on Sep 17 ClawHub
    # page latency went from ~2.5 s to ~10 s, so the ~400-page walk alone runs 60-70 min
    # and 50 min cancelled it again (#114525). The cron is 12-hourly; 120 min leaves headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: true

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages httpx==0.28.1 ruamel.yaml==0.18.17

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The repository token has a bounded API quota. The public sitemap
        # rows remain installable through on-demand path discovery, while
        # source crawling retains the strict health floors below.
        run: python scripts/build_skills_index.py --skip-path-resolution

      - name: Verify index before publishing artifact
        run: |
          set -euo pipefail
          python scripts/ci/skills_index_probe.py website/static/api/skills-index.json > /tmp/nara-index-probe
          cat /tmp/nara-index-probe
          grep -qx 'status=ok' /tmp/nara-index-probe

      - name: Upload index artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7
